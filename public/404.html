<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NoteNest</title>
    <script>
      // Redirect back to the app root, preserving the path
      sessionStorage.setItem('redirect', location.href)
      location.replace(
        location.origin +
        '/note-nest/' +   // 👈 MUST match your base in vite.config.js
        location.search +
        location.hash
      )
    </script>
  </head>
  <body></body>
</html>
